
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تغییر رمز Touch Loop</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f5f9;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: white;
      width: calc(100% - 40px);
      max-width: 380px;
      padding: 24px;
      border-radius: 16px;
      box-sizing: border-box;
      box-shadow: 0 5px 24px #00000012;
    }
    h2 { text-align: center; }
    p { line-height: 1.9; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 15px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0;
      background: #1769e0;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h2>تغییر رمز Touch Loop</h2>
    <p>رمز جدید حساب مدیر را دو بار وارد کن.</p>

    <form id="resetForm">
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="رمز جدید، حداقل ۸ کاراکتر"
        required
      >
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="تکرار رمز جدید"
        required
      >
      <button id="submitButton" type="submit">
        ثبت رمز جدید
      </button>
    </form>

    <p id="message" role="status">
      در حال بررسی لینک بازیابی...
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://rkllnarnvbylpphshweu.supabase.co";

    // این مقدار را با کلید عمومی پروژه خودت جایگزین کن.
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_t8cRQM_w5THIwJvgXrYJNg_Fbxoaz6_";

    const message = document.getElementById("message");
    const form = document.getElementById("resetForm");
    const button = document.getElementById("submitButton");

    form.hidden = true;

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );

    async function checkRecoverySession() {
      try {
        const params = new URLSearchParams(
          window.location.search
        );
        const hash = new URLSearchParams(
          window.location.hash.substring(1)
        );

        if (
          params.get("error") ||
          hash.get("error") ||
          hash.get("error_description")
        ) {
          throw new Error(
            params.get("error_description") ||
            hash.get("error_description") ||
            params.get("error") ||
            hash.get("error") ||
            "لینک بازیابی معتبر نیست."
          );
        }

        const tokenHash = params.get("token_hash");
        const type = params.get("type");

        if (tokenHash && type === "recovery") {
          const { error } = await client.auth.verifyOtp({
            token_hash: tokenHash,
            type: "recovery"
          });

          if (error) throw error;

          history.replaceState(
            null, "", window.location.pathname
          );
        }

        const { data, error } = await client.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          throw new Error(
            "نشست بازیابی پیدا نشد. یک ایمیل بازیابی جدید درخواست کن."
          );
        }

        form.hidden = false;
        message.textContent =
          "لینک تأیید شد. رمز جدیدت را وارد کن.";
      } catch (error) {
        message.textContent =
          "خطا: " + (error.message || "بررسی لینک ناموفق بود.");
      }
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const password =
        document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent =
          "رمز باید حداقل ۸ کاراکتر باشد.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent =
          "دو رمز واردشده یکسان نیستند.";
        return;
      }

      button.disabled = true;
      message.textContent = "در حال ثبت رمز جدید...";

      try {
        const { data, error } = await client.auth.updateUser({
          password: password
        });

        if (error) throw error;

        if (!data.user) {
          throw new Error("تغییر رمز تأیید نشد.");
        }

        await client.auth.signOut();

        form.hidden = true;
        message.textContent =
          "رمز با موفقیت تغییر کرد. حالا می‌توانی با رمز جدید وارد برنامه شوی.";
      } catch (error) {
        message.textContent =
          "خطا: " + (error.message || "تغییر رمز ناموفق بود.");
      } finally {
        button.disabled = false;
      }
    });

    checkRecoverySession();
  </script>
</body>
</html>
