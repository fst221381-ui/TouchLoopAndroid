<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تغییر رمز مدیر Touch Loop</title>

  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f5f9;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      width: calc(100% - 32px);
      max-width: 400px;
      padding: 24px;
      border-radius: 16px;
      box-sizing: border-box;
      box-shadow: 0 5px 24px #00000012;
    }

    h2 {
      text-align: center;
    }

    p {
      line-height: 1.9;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 15px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: 0;
      background: #1769e0;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="card">
    <h2>تغییر رمز مدیر Touch Loop</h2>

    <p>
      ایمیل مدیر و رمز فعلی را وارد کن؛ سپس رمز جدیدت را ثبت کن.
    </p>

    <form id="changeForm">
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="ایمیل حساب مدیر"
        required
      >

      <input
        id="currentPassword"
        type="password"
        autocomplete="current-password"
        placeholder="رمز فعلی"
        required
      >

      <input
        id="newPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="رمز جدید، حداقل ۸ کاراکتر"
        required
      >

      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="تکرار رمز جدید"
        required
      >

      <button id="submitButton" type="submit">
        تغییر رمز
      </button>
    </form>

    <p id="message" role="status">
      اطلاعات را وارد کن.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://rkllnarnvbylpphshweu.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_t8cRQM_w5THIwJvgXrYJNg_Fbxoaz6_";

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("changeForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const currentPassword =
        document.getElementById("currentPassword").value;

      const newPassword =
        document.getElementById("newPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (newPassword.length < 8) {
        message.textContent =
          "رمز جدید باید حداقل ۸ کاراکتر باشد.";
        return;
      }

      if (newPassword !== confirmPassword) {
        message.textContent =
          "رمز جدید و تکرار آن یکسان نیستند.";
        return;
      }

      if (newPassword === currentPassword) {
        message.textContent =
          "رمز جدید باید با رمز فعلی متفاوت باشد.";
        return;
      }

      button.disabled = true;
      message.textContent = "در حال بررسی اطلاعات...";

      try {
        // ورود با ایمیل و رمز فعلی
        const { data: loginData, error: loginError } =
          await client.auth.signInWithPassword({
            email: email,
            password: currentPassword
          });

        if (loginError) {
          throw loginError;
        }

        if (!loginData.user) {
          throw new Error("ورود به حساب مدیر انجام نشد.");
        }

        message.textContent = "ورود موفق بود؛ در حال تغییر رمز...";

        // ثبت رمز جدید
        const { data: updateData, error: updateError } =
          await client.auth.updateUser({
            password: newPassword
          });

        if (updateError) {
          throw updateError;
        }

        if (!updateData.user) {
          throw new Error("تغییر رمز تأیید نشد.");
        }

        await client.auth.signOut();

        form.reset();

        message.textContent =
          "رمز با موفقیت تغییر کرد. اکنون با رمز جدید وارد برنامه شو.";

      } catch (error) {
        message.textContent =
          "خطا: " + (
            error.message || "عملیات انجام نشد."
          );
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
